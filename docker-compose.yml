# Hearth — a real local network on your Mac.
#
#   docker compose up --build
#
# Brings up:
#   seed     — non-mining bootstrap node (RPC on host :8645)
#   miner1   — mining node, peers to seed
#   miner2   — mining node, peers to seed
#
# The seed's Ethereum JSON-RPC is on http://localhost:8545 and its REST API on
# http://localhost:8645. There is no web service here any more: `./web` and
# `./site` were the pre-migration single-repo front ends and were removed on
# 2026-08-04, superseded by `micro-explorer-web`, `micro-wallet-extension` and
# `micro-hearth-wallet-core`. Point a browser at the estate's own surfaces, or
# at these ports directly.
#
# THE ACCOUNT-MODEL CHAIN, not the retired UTXO one. `hearthd` runs the UTXO
# chain unless told otherwise and this bundle used to say nothing, so it served
# a chain the eth_*-native front ends could not read a single field of: the
# UTXO node has no eth_* surface at all. HEARTH_DATA
# keeps the account-model blocks in a subdirectory, because both chains write
# the same `blocks.ndjson` filename and an EVM node pointed at UTXO history
# reads garbage rather than refusing.
x-hearth-evm: &hearth-evm
  HEARTH_EVM: "1"
  HEARTH_JSONRPC: "8545"
  HEARTH_DATA: /data/evm

services:
  seed:
    build: ./node
    container_name: hearth-seed
    environment:
      HEARTH_P2P: "8646"
      HEARTH_RPC: "8645"
      <<: *hearth-evm
    ports:
      - "8545:8545"   # Ethereum JSON-RPC — what the explorer and wallet speak
      - "8645:8645"   # REST + SSE — /info, /events, /mining/* (mine.html)
      - "8646:8646"
    volumes:
      - seed-data:/data

  miner1:
    build: ./node
    container_name: hearth-miner1
    environment:
      HEARTH_PEERS: "seed:8646"
      HEARTH_MINE: "1"
      HEARTH_THROTTLE: "0.6"
      <<: *hearth-evm
    depends_on: [seed]
    volumes:
      - miner1-data:/data

  miner2:
    build: ./node
    container_name: hearth-miner2
    environment:
      HEARTH_PEERS: "seed:8646"
      HEARTH_MINE: "1"
      HEARTH_THROTTLE: "0.6"
      <<: *hearth-evm
    depends_on: [seed]
    volumes:
      - miner2-data:/data

volumes:
  seed-data:
  miner1-data:
  miner2-data:
