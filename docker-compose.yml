# Hearth — a real local network on your Mac.
#
#   docker compose up --build
#
# Brings up:
#   seed     — non-mining bootstrap node (RPC on host :8645)
#   miner1   — mining node, peers to seed
#   miner2   — mining node, peers to seed
#   web      — explorer + wallet + merchant demo (host :8080)
#
# Open http://localhost:8080 — the explorer reads the live chain from the seed
# node's RPC at http://localhost:8645. The Hearth marketing site is a separate
# app in ../site (port 3003); this bundle is the explorer and the wallet.

services:
  seed:
    build: ./node
    container_name: hearth-seed
    environment:
      HEARTH_P2P: "8646"
      HEARTH_RPC: "8645"
    ports:
      - "8645:8645"   # RPC/HTTP exposed to the host (browser talks to this)
      - "8646:8646"
    volumes:
      - seed-data:/data

  miner1:
    build: ./node
    container_name: hearth-miner1
    environment:
      HEARTH_PEERS: "seed:8646"
      HEARTH_MINE: "1"
      HEARTH_THROTTLE: "0.6"
    depends_on: [seed]
    volumes:
      - miner1-data:/data

  miner2:
    build: ./node
    container_name: hearth-miner2
    environment:
      HEARTH_PEERS: "seed:8646"
      HEARTH_MINE: "1"
      HEARTH_THROTTLE: "0.6"
    depends_on: [seed]
    volumes:
      - miner2-data:/data

  web:
    image: nginx:alpine
    container_name: hearth-web
    ports:
      - "8080:80"
    environment:
      # The config proxies /rpc/ to the node; here that node is `seed`, not the
      # testnet name baked into the image.
      HEARTH_RPC_UPSTREAM: seed:8645
      NGINX_ENVSUBST_FILTER: HEARTH_
    volumes:
      - ./web:/usr/share/nginx/html:ro
      # bind-mounted rather than baked so editing a page still needs no rebuild,
      # which also means the config has to come in the same way — as a template,
      # because it now carries a deployment variable
      - ./web/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on: [seed]

volumes:
  seed-data:
  miner1-data:
  miner2-data:
