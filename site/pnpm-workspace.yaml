# This directory is its own pnpm project, not part of a workspace: the rest of
# this repo (node/, web/) deliberately has no install step, and the site should
# not impose one on it.
packages:
  - .

# Decide every dependency build script up front. Left out, `pnpm install`
# REWRITES this file mid-install with `<pkg>: set this to true or false`
# placeholders, which then read back as a changed setting and fail every later
# command.
allowBuilds:
  esbuild: false

# pnpm quarantines newly-published packages until they age. This one is ours,
# published from cloudsforge-online/shared-libs, so the gate is protecting us
# from ourselves. pnpm writes this block itself on first install; leaving it
# unrecorded trips verifyDepsBeforeRun on the very next command.
minimumReleaseAgeExclude:
  - '@cloudsforge/ui@0.1.1'
  - '@cloudsforge/ui@0.2.0'
  - '@cloudsforge/ui@0.3.0'
  - '@cloudsforge/shared@0.2.0'

# esbuild arrives via vite and ships a prebuilt platform binary as
# @esbuild/<platform>, so its postinstall is not needed.
strictDepBuilds: false

verifyDepsBeforeRun: error
