name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  node:
    name: Node reference client (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ONE command, not a list of them. This job used to name each suite
      # individually, and package.json named them too — so the moment the EVM
      # work added keccak, rlp, uint256, secp256k1, opcodes, gas, precompiles,
      # trie, statedb and the conformance harness, CI silently kept running the
      # seven it already knew about. Ten suites were green locally and untested
      # here, while the spec claimed conformance was CI-gating. It was not.
      #
      # `npm test` is the single source of truth. A new suite is covered the
      # moment it is added there, which is the only arrangement that cannot rot.
      #
      # What it covers, and why each matters:
      #   keccak / rlp / uint256 / secp256k1  the primitives the EVM is built on,
      #                                       each against published vectors
      #   opcodes / gas / precompiles         gas is consensus; a wrong constant
      #                                       is a chain split
      #   trie / statedb                      a wrong state root is a silent split
      #   conformance --selftest              proves the harness can still FAIL;
      #                                       a harness that cannot is worse than none
      #   unit / e2e / records                the UTXO-era chain rules
      # `browser-pow` and `mining-api` are NOT in this list. They tested
      # web/assets/mining — the browser miner — and were deleted with it on
      # 2026-08-04. `mining-api` has no successor; the node's own /mining/* path is
      # covered by suites that test the node rather than a browser port of it:
      #   mine-session / miner-cli /          the light-miner path: templates,
      #   mining-budget / evmchain            submission, staleness, refusals
      #   mining-stale                        and what a miner is TOLD when its
      #                                       template is gone, over real HTTP
      #                                       against both node implementations.
      #                                       400 and 409 are opposite
      #                                       instructions — "you have a bug,
      #                                       stop" against "you were late,
      #                                       refetch" — and expiry and eviction
      #                                       answered the first for the whole
      #                                       of the public testnet's life
      #                                       (micro-org#237)
      # `browser-pow` and `browser-proof` DO exist again — see the `browser` job
      # below. They stay out of `npm test` because they need a second repository
      # checked out, and this command must pass on a bare checkout of this one.
      # The browser wallet's key sealing is not here either. It was `keystore`,
      # against the Ed25519 keystore the account-model rebuild superseded; that
      # module is gone and the suite with it. The current keystore is covered
      # OUTSIDE this repository — micro-hearth-wallet-core's test/oracle-keystore
      # seals a record here and opens it with node/src/cli/keystore.js, and the
      # reverse, in-process. See the `web` job below.
      #   p2p-fork                            two real nodes on real sockets:
      #                                       partition, compete, reconnect, reorg
      #   pow-params                          what the PoW parameters COST. The
      #                                       production sizes in params.js had
      #                                       never been evaluated by anything;
      #                                       this refuses a pad that cannot be
      #                                       verified inside a block interval
      #   bench/block-execution               one transaction spending the whole
      #                                       30M block gas limit on SSTOREs.
      #                                       Nothing else in the suite has a
      #                                       cost assertion, and cost is the
      #                                       only observable of CF-10 — the
      #                                       state roots were always correct
      - name: All node suites
        run: npm test
      - name: Coinnomics model sanity
        run: node ../proto/emission.js > /dev/null

  rust:
    name: Rust production core (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/hearthd
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build (release)
        run: cargo build --release
      - name: Test
        run: cargo test

  browser:
    name: Browser miner vs this node (cross-implementation)
    runs-on: ubuntu-latest
    steps:
      # THIS JOB EXISTS BECAUSE ITS ABSENCE WAS INVISIBLE. The browser miner was
      # deleted from this repository with web/ on 2026-08-04 (48bc28a) and restored
      # in micro-network-site on 2026-08-06 — but node/test/browser-pow.js and
      # node/test/browser-proof.js were not restored with it. For three days there
      # was a live browser miner grinding Homefire against this chain and nothing
      # comparing the two, while SECURITY.md, node/README.md, rust/README.md,
      # docs/why-two-implementations.md, docs/listing-checklist.md M16 and two
      # source comments all cited those files in the present tense. A document that
      # asserts a gate is not a gate.
      #
      # What the two suites establish, and why each is worth a checkout:
      #   browser-pow    the HASH loop, digest for digest — SHA-256 padding edges,
      #                  powSeed (hex hashed as TEXT, the nonce as decimal), Homefire
      #                  at the live params AND at retuned ones, and meetsTarget
      #                  including the equality case the node accepts. A digest that
      #                  differs in one bit is a block the network refuses while the
      #                  tab looks busy at full fan speed and pays nothing.
      #   browser-proof  the SIGNATURE, which is the other half of a submission and
      #                  where the one real node/browser disagreement ever was: the
      #                  browser sent 64 bytes for months against the node's 65
      #                  (r || s || recoveryId), so every block it found was answered
      #                  `bad signature` after the work. It imports the browser's own
      #                  proofSignature and requires the node's template flow to
      #                  produce a block, rather than describing the format.
      #
      # No token: cloudsforge-online/micro-network-site is public, as this repository
      # is to its CI, which already checks this one out for the same reason.
      # actions/checkout cannot write above the workspace, so it lands nested and
      # HEARTH_BROWSER_MINING_SRC names the directory explicitly — the resolver
      # refuses to fall back from an explicit path, because a typo that quietly
      # resolved to some other tree would report a pass about code nobody meant to
      # test.
      #
      # The suites FAIL rather than skip when the browser sources are missing. A
      # "skipped" line scrolls past exactly like a pass, and that is close enough to
      # what went wrong here to be worth refusing.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-network-site
          path: micro-network-site
      - name: The browser miner agrees with this node, digest for digest
        env:
          HEARTH_BROWSER_MINING_SRC: ${{ github.workspace }}/micro-network-site/src/mining
        working-directory: node
        run: npm run test:browser

  web:
    name: Web assets (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The front-end syntax check, explorer self-test and wallet self-test that
      # stood here all read `web/assets`, removed on 2026-08-04 with the rest of
      # the pre-migration front ends.
      #
      # The wallet one carried the strongest claim in this file — that the browser
      # ports of secp256k1, RLP and the legacy transaction still sign identically
      # to the node, "because a wallet that signs differently from the node does
      # not bounce, it pays the wrong person". That gate was NOT dropped. It moved
      # and got stronger: `micro-hearth-wallet-core`'s `test/oracle-primitives.ts`
      # and `test/oracle-transaction.ts` compare against `hearth/node/src` executed
      # IN-PROCESS, and its header records the rule the old self-test could not
      # make — "nothing here is compared against a fixture this library produced".

  secret-hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env must never be tracked by git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          echo "ok: .env is not tracked"
      - name: No API tokens committed
        run: |
          if git grep -nIE 'sk-proj-[A-Za-z0-9_-]{20,}' -- . ':!*.example' ':!.github/workflows/*'; then
            echo "::error::possible committed API token"
            exit 1
          fi
          echo "ok: no committed API tokens found"
      # Matches a PEM header followed by real base64 body, not the header alone.
      # The tree that made this necessary (web/, which built and accepted PEM for
      # wallet key export/import) is gone, but the rule stays: a bare PEM header
      # can legitimately appear in source as a string literal or a placeholder —
      # a check that flags those gets muted, which is how a real key eventually
      # slips through.
      - name: No private keys committed
        run: |
          hits=$(git ls-files -z | xargs -0 grep -lPz --binary-files=without-match \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----\s*\r?\n[A-Za-z0-9+/=]{40,}' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::possible committed private key"
            exit 1
          fi
          echo "ok: no committed private keys found"

  contracts:
    name: DeFi contracts (compile + init code hash)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned here rather than read from a packageManager field: this repo has
      # no root package.json, and pnpm/action-setup looks for one at the repo
      # root regardless of the job's working-directory. Without it the step
      # fails with "No pnpm version is specified" before any contract compiles.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - run: pnpm install --frozen-lockfile
      # The Router computes pair addresses from a hard-coded init code hash
      # rather than asking the factory, so a hash that drifts sends it looking
      # for pools at addresses where none exist — the most common way a Uniswap
      # V2 fork fails, and it fails silently with an empty quote rather than an
      # error. compile.mjs refuses to build on mismatch; these tests assert the
      # factory embeds that exact init code, that the deliberate-overflow
      # unchecked blocks survive the 0.8 port, and that no Cancun opcode crept
      # in past our Shanghai target.
      - name: Compile and verify
        run: node scripts/compile.mjs
      - name: Build tests
        run: node --test test/build.test.mjs
      # The phase 7 gate, and it runs HERE rather than in the node job for one
      # reason: it needs `contracts/out`, and `npm test` is required to run with
      # zero installed dependencies. This job is the only one that has solc.
      #
      # It earns the slot because it is the only suite that runs bytecode nobody
      # here compiled or reasoned about — a real V2 swap exercises CREATE2, deep
      # CALL chains, ecrecover, SSTORE refunds, memory expansion,
      # revert-with-reason and the 63/64 rule *together*, and the conformance
      # vectors are each small enough to miss what only appears in combination.
      # It has been passing 167/167 locally while gating nothing.
      #
      # This job's working-directory is `contracts`, hence the `../`. The suite
      # resolves `contracts/out` off __dirname, so cwd does not matter to it.
      - name: Uniswap V2 on our own EVM (phase 7 gate)
        run: node ../node/test/dex.js
      # Forge Exchange phase A (docs/ecosystem/39-forge-exchange.md §7). The
      # factory's `feeToSetter` has no timelock and no two-step handover, and
      # moving it off a compromised key needs that key — so it must already be a
      # contract no one person can operate on the day the factory is deployed.
      # This proves HearthMultisig is one: m-of-n holds, signers rotate, a
      # rotated-out key's existing confirmation stops counting, a raised
      # threshold binds proposals already confirmed under the old one, and a
      # real HearthV2Factory obeys the wallet while refusing the EOA that
      # deployed it.
      #
      # It also carries the two findings from the phase E read-through, both of
      # which are regressions you cannot see in a compile: a rotated-out signer
      # who is later re-added does NOT bring their old confirmations back with
      # them (#26), and a fully confirmed proposal to send `feeToSetter` to the
      # zero address is refused rather than permanently deleting the fee switch
      # (#25). Each was written against the old bytecode first and failed there.
      - name: The multisig that holds feeToSetter (phase A gate)
        run: node ../node/test/multisig.js
      # Forge Exchange phase G (docs/ecosystem/39-forge-exchange.md §6, §4). A wrapped
      # asset is the one thing in the exchange plan that can take a user's real Litecoin
      # and hand back a number, so the gate is not "it compiles" but "a stranger can
      # compare issued supply to reserves on-chain, and a redemption completes".
      #
      # What this run defends, none of which a compile can see: a receipt with no
      # attestation mints nothing (which is the estate's actual state — no
      # platform-controlled LTC, BTC or DOGE address has ever received anything), issuing
      # one unit past the attested reserve reverts while issuing exactly up to it does
      # not, an attestation goes stale on a clock, a shortfall can be RECORDED rather
      # than hidden, an old reserve reading cannot be replayed at a lower height, and a
      # holder can still redeem and transfer while issuance is frozen. It also runs a
      # real HearthMultisig as the issuer, so the figure that bounds every mint cannot be
      # moved by one key.
      - name: The receipt that cannot out-issue its reserve (phase G gate)
        run: node ../node/test/forge-receipt.js

  tools:
    name: Developer kit (faucet, explorer API, verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tools/verify downloads a ~9 MB soljson build and checks it against the
      # keccak256 published in binaries.soliditylang.org's own list.json. The
      # cache saves the download, not the check — the hash is verified on every
      # run, including a cache hit, so a poisoned cache cannot be loaded.
      - name: Cache solc builds
        uses: actions/cache@v4
        with:
          path: tools/verify/.solc-cache
          key: solc-v0.8.26+commit.8a97fa7a
      # The faucet holds a funded key and its whole engineering problem is
      # REFUSING: per-address and per-IP limits, a global payout cap, a clear
      # answer when dry, and — the one that looks correct in review and is not —
      # a check-and-record that is atomic against concurrent requests for the
      # same address. These run over real HTTP against a stub node and need no
      # network and no dependencies.
      #
      # EVERY STEP FROM HERE DOWN CARRIES `if: ${{ !cancelled() }}`, and it is
      # not decoration. GitHub Actions skips the remaining steps of a job the
      # moment one fails, so while `tools/explorer-api` was red — which it was
      # on every push, see CF-29 — the three steps BELOW it never executed at
      # all. `tools/verify`'s 116 checks, including the byte-flip rejection that
      # gates the exchange listing, had never gated anything. A red job that
      # also silently disables the checks after it is worse than a red job.
      # `!cancelled()` still stops everything on a manual cancel or a timeout.
      - name: Faucet
        if: ${{ !cancelled() }}
        run: node tools/faucet/test/faucet.test.js
      # The two services that stand between Hearth and an exchange listing
      # (docs/listing-checklist.md §3). Both run over real HTTP with no network
      # and no dependencies — the explorer API against a fake chain served by
      # node/src/jsonrpc, so the fixtures are encoded by the same code the real
      # RPC will use.
      #
      # The assertions that matter in the explorer API are the ones about
      # REFUSING: an index that is behind the node must not answer "no
      # transactions found", `txlistinternal` must not claim an empty list on a
      # chain with no tracer, and circulating supply must not be served as total
      # supply when the Commons treasury cannot be subtracted — which is exactly
      # the defect in the node's own /supply that this service exists to fix.
      # It also unwinds a reorg and asserts the orphaned transaction stops being
      # served, which an append-only indexer would fail.
      - name: Explorer API (Etherscan shim + address index)
        if: ${{ !cancelled() }}
        run: node tools/explorer-api/test/explorer-api.test.js
      # And the gate the fixture suite above is NOT. This boots a real node from
      # node/src — real proof-of-work, real signed transactions, real EVM
      # execution — mines a block with two log-emitting transactions, points the
      # explorer service at it and requires that `module=account&action=balance`
      # and `module=logs&action=getLogs` agree field for field with
      # `eth_getBalance` and `eth_getLogs`.
      #
      # A fake chain agrees with whatever its author believed, and that is
      # precisely how this job came to be red: its author believed the node
      # numbers `logIndex` per receipt, so the fixture omitted the field and the
      # node's own receipt formatter refused it. Nothing fixture-shaped could
      # have caught that. Point it at a running node with
      # HEARTH_LIVE_RPC_URL=http://127.0.0.1:8545 to run the same comparison
      # against the compose testnet.
      - name: Explorer API against a real chain (the aggregator/listing gate)
        if: ${{ !cancelled() }}
        run: node tools/explorer-api/test/live-chain.test.js
      # And in the verifier, the assertion that matters is the REJECTION: it
      # compiles contracts/src/WEMBER.sol with the pinned solc, verifies the
      # match, then changes one byte of the deployed code and requires a refusal
      # naming the offset. A verifier that cannot reject is worse than none,
      # because it turns "unverified bytecode" into "verified, apparently".
      #
      # This step needs network access to binaries.soliditylang.org on a cache
      # miss. If that is ever a problem, pre-seed tools/verify/.solc-cache and
      # set HEARTH_VERIFY_SOLC_OFFLINE=1.
      - name: Contract verification (compile, match, then reject)
        if: ${{ !cancelled() }}
        run: node tools/verify/test/verify.test.js
      # Not a compile — just proof that the templates and the probe still parse
      # after a refactor upstream. `hardhat.config.js` in particular is the file
      # that pins evmVersion to shanghai, and a syntax error in it fails as
      # "cannot find network hearth", which is not a useful signal.
      - name: Templates and probe parse
        if: ${{ !cancelled() }}
        run: |
          node --check tools/rpc-probe/stub.js
          node --check tools/hardhat/hardhat.config.js
          for f in tools/hardhat/scripts/*.js; do node --check "$f"; done
      # The probe imports node/src/jsonrpc and node/src/chain/transaction
      # directly, so this catches an interface change in either the moment it
      # lands rather than the next time someone runs the developer kit.
      - name: The probe boots and answers the chain id in both encodings
        if: ${{ !cancelled() }}
        run: |
          node tools/rpc-probe/stub.js --port 8745 &
          sleep 2
          post() { curl -sf -X POST -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":[]}" \
            http://127.0.0.1:8745; }
          test "$(post eth_chainId  | sed 's/.*"result":"\([^"]*\)".*/\1/')" = "0x1cf3"
          test "$(post net_version  | sed 's/.*"result":"\([^"]*\)".*/\1/')" = "7411"
          echo "ok: eth_chainId is hex, net_version is decimal"
