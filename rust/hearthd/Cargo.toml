[package]
name = "hearthd"
version = "0.1.0"
edition = "2021"
description = "Hearth production node core (Rust) — Homefire proof-of-work"
license = "MIT"

# The hash + PoW core stays pure-std. The ONLY third-party crates are the two
# needed for real signatures — deliberately chosen, widely-audited, and pinned:
#   ed25519-dalek : the reference Rust Ed25519 implementation
#   getrandom     : OS CSPRNG for key generation
# Everything else (ledger, mempool, difficulty, P2P framing, Tab channels) is std.
[dependencies]
ed25519-dalek = "2"
getrandom = "0.2"

[[bin]]
name = "hearthd"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
