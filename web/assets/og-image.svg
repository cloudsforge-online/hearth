  <text x="360" y="250" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="120" font-weight="800" fill="#f5ece0" letter-spacing="-3">Hearth</text>
  <text x="362" y="330" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="46" font-weight="800" fill="url(#txt)">Money mined at home. Made to spend.</text>
  <text x="362" y="392" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="500" fill="#cdbfae">ASIC-resistant proof-of-work · CPU-only · fair launch · near-zero fees</text>
