# The explorer / wallet, served by nginx.
#
# Access logs are JSON because the stack's log aggregator tails container
# stdout: nginx's default `combined` format is text and arrives as one opaque
# string. The "log":"nginx" key is what the aggregator's parser keys off, so
# this format is shared verbatim with every other front-end in the stack.
log_format json_combined escape=json '{"log":"nginx","time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent",'
  '"request_time":$request_time,"request_id":"$http_x_request_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    # These are hand-written multi-page files, NOT a single-page app: no
    # try_files fallback to index.html, because that would answer a broken link
    # with a 200 and hide it from the logs this config exists to produce.
    location / {
        try_files $uri $uri/ =404;
    }

    # The image copies this whole directory to the web root; these are build
    # inputs, not content.
    location ~ ^/(nginx\.conf|Dockerfile)$ { return 404; }
}
