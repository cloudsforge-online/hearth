# The explorer / wallet, served by nginx.
#
# Access logs are JSON because the stack's log aggregator tails container
# stdout: nginx's default `combined` format is text and arrives as one opaque
# string. The "log":"nginx" key is what the aggregator's parser keys off, so
# this format is shared verbatim with every other front-end in the stack.
log_format json_combined escape=json '{"log":"nginx","time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"referer":"$http_referer","user_agent":"$http_user_agent",'
  '"request_time":$request_time,"request_id":"$http_x_request_id"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    # Security headers. There were none, on the origin that serves a
    # non-custodial wallet holding real value: any injected <script src> would
    # have been fetched and run, and any framing site could have clickjacked the
    # send button.
    #
    # `script-src 'unsafe-inline'` is a real weakness and is here because these
    # are hand-written multi-page files whose logic lives in inline <script>
    # blocks; removing it means hashing or nonce-ing every one of them, which
    # nginx cannot do for static files. It is still strictly better than no
    # policy: `default-src 'self'` and `object-src 'none'` mean an injected
    # external script, plugin or iframe does not load at all, which is the shape
    # of nearly every real supply-chain hit on a static site.
    #
    # connect-src is deployment config (HEARTH_CSP_CONNECT, defaulted in the
    # Dockerfile) because it has to name two things this file cannot know: the
    # Lantern host that assets/obs.js reports client errors to, and the loopback
    # ports a developer points `?rpc=` at. Everything else is refused on purpose
    # — a link that aimed the wallet at an attacker's "node" would otherwise get
    # to decide what your balance and UTXO set look like.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src ${HEARTH_CSP_CONNECT}; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The wallet has a one-click "Sign & broadcast"; nothing here should ever be
    # in someone else's frame.
    add_header X-Frame-Options "DENY" always;

    # WHICH CHAIN THIS DEPLOYMENT SERVES, injected into the pages.
    #
    # There is no build step here — these are hand-written static files — so the
    # chain id cannot be compiled in, and it must not be a constant in the
    # bundle: 7411 (mainnet) and 7412 (testnet) are served by the same image, and
    # the id is what EIP-155 binds every signature the wallet produces to. Each
    # page carries an EMPTY `<meta name="hearth-chain-id" content="">` and this
    # rewrites it on the way out; web/assets/chain.js reads it and falls back to
    # its own default when the value is empty, which is what a page opened
    # straight off disk sees.
    #
    # Only text/html is filtered (the default), so proxied JSON-RPC bodies and
    # the /rpc/events stream are untouched.
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter '<meta name="hearth-chain-id" content="">' '<meta name="hearth-chain-id" content="${HEARTH_CHAIN_ID}">';

    # These are hand-written multi-page files, NOT a single-page app: no
    # try_files fallback to index.html, because that would answer a broken link
    # with a 200 and hide it from the logs this config exists to produce.
    location / {
        try_files $uri $uri/ =404;
    }

    # The node's REST/SSE API, same-origin.
    #
    # The explorer used to guess `<protocol>//<hostname>:8645`, which resolves to
    # explorer.cloudsforge.online:8645 in production — a port nothing publishes
    # and the tunnel does not route. Every call failed and the pages quietly fell
    # back to the demo generator in app.js, so the public explorer has been
    # showing invented blocks. Proxying here means the browser only ever talks to
    # the origin it loaded from: no second hostname, no CORS, and no way for the
    # page to be up while the node it claims to describe is not.
    #
    # THIS IS THE REST PORT (8645) AND MUST STAY THAT WAY. mine.html reads
    # `/rpc/info` and `EventSource('/rpc/events')` through assets/api.js and
    # `/rpc/mining/template` + `/rpc/mining/submit` through assets/mining/miner.js.
    # Those routes exist only on the REST server. The Ethereum JSON-RPC surface
    # is a SECOND listener on a SECOND port and gets its own location below —
    # repointing this one at 8545 would trade one broken page for another.
    location /rpc/ {
        proxy_pass http://${HEARTH_RPC_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;

        # /events is Server-Sent Events: buffering it would hold the stream in
        # nginx until the response ended, which for a live feed is never.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 1h;
    }

    # The node's Ethereum JSON-RPC API, same-origin — the explorer and the
    # wallet's only transport (assets/explorer/rpc.js).
    #
    # It is a separate location because it is a separate SERVER on a separate
    # port: `hearthd` runs REST on 8645 and eth_* JSON-RPC on 8545, and the REST
    # server answers an eth_* POST with HTTP 404 and a body that says so
    # (node/src/evmnode.js). Proxied through the origin for the same reasons as
    # /rpc/ above, plus one more: the CSP's connect-src does not have to name a
    # second hostname.
    #
    # The path name matches the <meta name="hearth-eth-rpc"> override that
    # rpc.js checks before it falls back here, so grepping for either finds both.
    location /eth-rpc/ {
        proxy_pass http://${HEARTH_ETH_RPC_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;

        # eth_getLogs over a wide range and eth_call against a fat contract are
        # both legitimately slow; the explorer would rather wait than retry.
        proxy_read_timeout 60s;
    }

    # The image copies this whole directory to the web root; these are build
    # inputs, not content.
    location ~ ^/(nginx\.conf|Dockerfile)$ { return 404; }
}
